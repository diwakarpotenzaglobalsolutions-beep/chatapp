on:
  pull_request:
    branches:
      - main
      - master
  push:
    branches:
      - main
      - master
      - develop
name: "Build & Release"
jobs:
  build:
    name: Build & Release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare FCM service account asset
        run: |
          mkdir -p assets
          if [ -n "${{ secrets.FCM_SERVICE_ACCOUNT_JSON }}" ]; then
            printf '%s' "${{ secrets.FCM_SERVICE_ACCOUNT_JSON }}" > assets/notijson.json
          elif [ ! -f assets/notijson.json ]; then
            cp assets/notijson.json.example assets/notijson.json
          fi
          test -f assets/notijson.json

      - run: flutter pub get

      - name: Verify Dart compiles
        run: flutter analyze lib --no-fatal-infos --no-fatal-warnings

      - run: flutter build apk --release --split-per-abi --android-skip-build-dependency-validation

      - run: |
          flutter build ios --no-codesign
          cd build/ios/iphoneos
          mkdir Payload
          cd Payload
          ln -s ../Runner.app
          cd ..
          zip -r app.ipa Payload

      - name: Push to Releases
        uses: ncipollo/release-action@v1
        with:
          artifacts: "build/app/outputs/apk/release/*,build/ios/iphoneos/app.ipa"
          tag: v1.0.${{ github.run_number }}
          token: ${{ secrets.TOKEN }}
