name: Build & Release

on:
  pull_request:
    branches:
      - main
      - master
  push:
    branches:
      - main
      - master
      - develop

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare FCM service account asset
        run: |
          mkdir -p assets
          if [ -n "${{ secrets.FCM_SERVICE_ACCOUNT_JSON }}" ]; then
            printf '%s' "${{ secrets.FCM_SERVICE_ACCOUNT_JSON }}" > assets/notijson.json
          elif [ ! -f assets/notijson.json ]; then
            cp assets/notijson.json.example assets/notijson.json
          fi
          test -f assets/notijson.json

      - run: flutter pub get

      - name: Verify Dart
        run: flutter analyze lib --no-fatal-infos --no-fatal-warnings

      - name: Build Android APK
        run: |
          flutter build apk \
            --release \
            --split-per-abi \
            --android-skip-build-dependency-validation

      - uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 7

  ios:
    name: Build iOS IPA
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare FCM service account asset
        run: |
          mkdir -p assets
          if [ -n "${{ secrets.FCM_SERVICE_ACCOUNT_JSON }}" ]; then
            printf '%s' "${{ secrets.FCM_SERVICE_ACCOUNT_JSON }}" > assets/notijson.json
          elif [ ! -f assets/notijson.json ]; then
            cp assets/notijson.json.example assets/notijson.json
          fi
          test -f assets/notijson.json

      - run: flutter pub get

      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update

      - name: Check Apple signing secrets
        id: apple_signing
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          if [ -n "$APPLE_CERTIFICATE_BASE64" ] && \
             [ -n "$APPLE_CERTIFICATE_PASSWORD" ] && \
             [ -n "$APPLE_PROVISIONING_PROFILE_BASE64" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Apple signing configured — building installable signed IPA."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Apple signing secrets missing — iOS will compile but IPA will not be installable on iPhone."
            echo "::warning::Add APPLE_CERTIFICATE_BASE64, APPLE_CERTIFICATE_PASSWORD, and APPLE_PROVISIONING_PROFILE_BASE64."
            echo "::warning::Run scripts/prepare_ios_secrets.sh on your Mac to generate these values."
          fi

      - name: Import signing certificate
        if: steps.apple_signing.outputs.enabled == 'true'
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      - name: Install provisioning profile
        if: steps.apple_signing.outputs.enabled == 'true'
        env:
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          PP_PATH="$RUNNER_TEMP/profile.mobileprovision"
          echo -n "$APPLE_PROVISIONING_PROFILE_BASE64" | base64 --decode -o "$PP_PATH"

          UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' /dev/stdin <<< "$(/usr/bin/security cms -D -i "$PP_PATH")")
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PP_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/${UUID}.mobileprovision"
          echo "Installed provisioning profile: $UUID"

      - name: Build signed IPA
        if: steps.apple_signing.outputs.enabled == 'true'
        run: flutter build ipa --export-options-plist=ios/ExportOptions.plist

      - name: Verify IPA is signed
        if: steps.apple_signing.outputs.enabled == 'true'
        run: |
          IPA=$(ls build/ios/ipa/*.ipa | head -1)
          test -n "$IPA"
          unzip -q "$IPA" -d /tmp/ipa-check
          codesign --verify --deep --strict /tmp/ipa-check/Payload/*.app
          echo "IPA signature verified: $IPA"

      - name: Build iOS (compile check, no signing)
        if: steps.apple_signing.outputs.enabled != 'true'
        run: flutter build ios --release --no-codesign

      - uses: actions/upload-artifact@v4
        if: steps.apple_signing.outputs.enabled == 'true'
        with:
          name: ios-ipa
          path: build/ios/ipa/*.ipa
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: [android, ios]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && needs.android.result == 'success'
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: android-apks
          path: artifacts/android-apks

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: ios-ipa
          path: artifacts/ios-ipa

      - name: List release artifacts
        run: find artifacts -type f

      - name: Prepare artifact list
        id: artifacts
        run: |
          list="artifacts/android-apks/*"
          if compgen -G "artifacts/ios-ipa/*.ipa" > /dev/null; then
            list="$list,artifacts/ios-ipa/*"
          else
            echo "::warning::No signed IPA in this release. Configure Apple signing secrets to fix iPhone install."
          fi
          echo "list=$list" >> "$GITHUB_OUTPUT"

      - name: Push to Releases
        uses: ncipollo/release-action@v1
        with:
          artifacts: ${{ steps.artifacts.outputs.list }}
          tag: v1.0.${{ github.run_number }}
          token: ${{ secrets.TOKEN }}
