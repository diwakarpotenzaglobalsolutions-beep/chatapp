name: Build & Release

on:
  pull_request:
    branches:
      - main
      - master
  push:
    branches:
      - main
      - master
      - develop

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare FCM service account asset
        run: |
          mkdir -p assets
          if [ -n "${{ secrets.FCM_SERVICE_ACCOUNT_JSON }}" ]; then
            printf '%s' "${{ secrets.FCM_SERVICE_ACCOUNT_JSON }}" > assets/notijson.json
          elif [ ! -f assets/notijson.json ]; then
            cp assets/notijson.json.example assets/notijson.json
          fi
          test -f assets/notijson.json

      - run: flutter pub get

      - name: Verify Dart
        run: flutter analyze lib --no-fatal-infos --no-fatal-warnings

      - name: Build Android APK
        run: |
          flutter build apk \
            --release \
            --split-per-abi \
            --android-skip-build-dependency-validation

      - name: Verify APK sizes
        run: |
          echo "Built APK files:"
          ls -lh build/app/outputs/flutter-apk/*.apk
          for apk in build/app/outputs/flutter-apk/*-release.apk; do
            bytes=$(stat -c%s "$apk")
            mb=$((bytes / 1024 / 1024))
            echo "$apk -> ${mb} MB"
            if [ "$mb" -lt 30 ]; then
              echo "::error::APK too small (${mb} MB). Expected ~70-90 MB for this app."
              exit 1
            fi
          done

      - name: Stage release APKs with clear names
        run: |
          mkdir -p release/android
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk release/android/chatapp-arm64.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk release/android/chatapp-arm32.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk release/android/chatapp-x86_64.apk
          ls -lh release/android/

      - uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: release/android/*.apk
          retention-days: 7

  ios:
    name: Build iOS IPA
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare FCM service account asset
        run: |
          mkdir -p assets
          if [ -n "${{ secrets.FCM_SERVICE_ACCOUNT_JSON }}" ]; then
            printf '%s' "${{ secrets.FCM_SERVICE_ACCOUNT_JSON }}" > assets/notijson.json
          elif [ ! -f assets/notijson.json ]; then
            cp assets/notijson.json.example assets/notijson.json
          fi
          test -f assets/notijson.json

      - run: flutter pub get

      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update

      - name: Check Apple signing secrets
        id: apple_signing
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          if [ -n "$APPLE_CERTIFICATE_BASE64" ] && \
             [ -n "$APPLE_CERTIFICATE_PASSWORD" ] && \
             [ -n "$APPLE_PROVISIONING_PROFILE_BASE64" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Apple signing configured — building installable signed IPA."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Apple signing secrets missing — no installable IPA will be published."
            echo "::warning::Add APPLE_CERTIFICATE_BASE64, APPLE_CERTIFICATE_PASSWORD, and APPLE_PROVISIONING_PROFILE_BASE64."
          fi

      - name: Import signing certificate
        if: steps.apple_signing.outputs.enabled == 'true'
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      - name: Install provisioning profile
        if: steps.apple_signing.outputs.enabled == 'true'
        env:
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          PP_PATH="$RUNNER_TEMP/profile.mobileprovision"
          echo -n "$APPLE_PROVISIONING_PROFILE_BASE64" | base64 --decode -o "$PP_PATH"

          UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' /dev/stdin <<< "$(/usr/bin/security cms -D -i "$PP_PATH")")
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PP_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/${UUID}.mobileprovision"
          echo "Installed provisioning profile: $UUID"

      - name: Build signed IPA
        if: steps.apple_signing.outputs.enabled == 'true'
        run: flutter build ipa --export-options-plist=ios/ExportOptions.plist

      - name: Verify IPA size and signature
        if: steps.apple_signing.outputs.enabled == 'true'
        run: |
          mkdir -p release/ios
          IPA=$(ls build/ios/ipa/*.ipa | head -1)
          cp "$IPA" release/ios/chatapp-signed.ipa

          ls -lh release/ios/
          bytes=$(stat -f%z release/ios/chatapp-signed.ipa)
          mb=$((bytes / 1024 / 1024))
          echo "IPA size: ${mb} MB"
          if [ "$mb" -lt 30 ]; then
            echo "::error::IPA too small (${mb} MB). Expected ~80-120 MB for this app."
            exit 1
          fi

          unzip -q release/ios/chatapp-signed.ipa -d /tmp/ipa-check
          codesign --verify --deep --strict /tmp/ipa-check/Payload/*.app
          echo "IPA signature verified."

      - name: Build iOS (compile check, no signing)
        if: steps.apple_signing.outputs.enabled != 'true'
        run: flutter build ios --release --no-codesign

      - uses: actions/upload-artifact@v4
        if: steps.apple_signing.outputs.enabled == 'true'
        with:
          name: ios-ipa
          path: release/ios/chatapp-signed.ipa
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: [android, ios]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && needs.android.result == 'success'
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: android-apks
          path: release-files/android

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: ios-ipa
          path: release-files/ios

      - name: List release files and sizes
        run: |
          echo "=== Files attached to this release ==="
          find release-files -type f -exec ls -lh {} \;
          echo ""
          echo "Do NOT download 'Source code (zip)' from GitHub — that is not the app."
          echo "Download chatapp-arm64.apk (Android) and chatapp-signed.ipa (iOS, when available)."

      - name: Prepare artifact list
        id: artifacts
        run: |
          list="release-files/android/*"
          if [ -f release-files/ios/chatapp-signed.ipa ]; then
            list="$list,release-files/ios/chatapp-signed.ipa"
          else
            echo "::warning::No signed IPA in this release. Configure Apple signing secrets for iPhone install."
          fi
          echo "list=$list" >> "$GITHUB_OUTPUT"

      - name: Push to Releases
        uses: ncipollo/release-action@v1
        with:
          artifacts: ${{ steps.artifacts.outputs.list }}
          tag: v1.0.${{ github.run_number }}
          token: ${{ secrets.TOKEN }}
          body: |
            ## Install files (download these)

            | File | Platform | Expected size |
            |------|----------|---------------|
            | **chatapp-arm64.apk** | Android phones (most devices) | ~80-90 MB |
            | chatapp-arm32.apk | Older Android 32-bit | ~70 MB |
            | chatapp-x86_64.apk | Android emulators | ~90 MB |
            | **chatapp-signed.ipa** | iPhone (signed builds only) | ~80-120 MB |

            **Important:** Do not use GitHub's auto-generated **"Source code (zip)"** — that is only project source (~20 MB), not the installable app.

            iOS IPA requires Apple signing secrets in GitHub Actions. Without them, only Android APKs are published.
