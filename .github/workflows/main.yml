name: Build & Release

on:
  pull_request:
    branches:
      - main
      - master
  push:
    branches:
      - main
      - master
      - develop

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare FCM service account asset
        run: |
          mkdir -p assets
          if [ -n "${{ secrets.FCM_SERVICE_ACCOUNT_JSON }}" ]; then
            printf '%s' "${{ secrets.FCM_SERVICE_ACCOUNT_JSON }}" > assets/notijson.json
          elif [ ! -f assets/notijson.json ]; then
            cp assets/notijson.json.example assets/notijson.json
          fi
          test -f assets/notijson.json

      - run: flutter pub get

      - name: Verify Dart
        run: flutter analyze lib --no-fatal-infos --no-fatal-warnings

      - name: Build Android APK
        run: |
          flutter build apk \
            --release \
            --split-per-abi \
            --android-skip-build-dependency-validation

      - uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 7

  ios:
    name: Build signed iOS IPA
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare FCM service account asset
        run: |
          mkdir -p assets
          if [ -n "${{ secrets.FCM_SERVICE_ACCOUNT_JSON }}" ]; then
            printf '%s' "${{ secrets.FCM_SERVICE_ACCOUNT_JSON }}" > assets/notijson.json
          elif [ ! -f assets/notijson.json ]; then
            cp assets/notijson.json.example assets/notijson.json
          fi
          test -f assets/notijson.json

      - run: flutter pub get

      - name: Verify Apple signing secrets
        run: |
          missing=0
          for secret in APPLE_CERTIFICATE_BASE64 APPLE_CERTIFICATE_PASSWORD APPLE_PROVISIONING_PROFILE_BASE64 KEYCHAIN_PASSWORD; do
            if [ -z "${!secret}" ]; then
              echo "::error::$secret GitHub secret is required for installable IPA files."
              missing=1
            fi
          done
          exit $missing
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}

      - name: Install Apple certificate and provisioning profile
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision

          echo -n "$APPLE_CERTIFICATE_BASE64" | base64 --decode -o "$CERTIFICATE_PATH"
          echo -n "$APPLE_PROVISIONING_PROFILE_BASE64" | base64 --decode -o "$PP_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$PP_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Build signed IPA
        run: flutter build ipa --export-options-plist=ios/ExportOptions.plist

      - uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: build/ios/ipa/*.ipa
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: [android, ios]
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List release artifacts
        run: find artifacts -type f

      - name: Push to Releases
        uses: ncipollo/release-action@v1
        with:
          artifacts: "artifacts/android-apks/*,artifacts/ios-ipa/*"
          tag: v1.0.${{ github.run_number }}
          token: ${{ secrets.TOKEN }}
